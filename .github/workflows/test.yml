name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux hosts
    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            accept-flake-config = true

      # Push-only (`skip-use`): pulls already come from the flake's own nixConfig, trusted via
      # accept-flake-config above. No push without a token (e.g. Dependabot PRs, which don't see
      # Actions secrets) - unlike cachix-action, attic-action doesn't fall back to pull-only itself.
      - name: Setup Nix cache
        uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0.5.2
        with:
          cache: oscarmarshall
          endpoint: https://attic.silverlight-nex.us
          inputs-from: .
          skip-push: ${{ secrets.ATTIC_TOKEN == '' }}
          skip-use: true
          token: ${{ secrets.ATTIC_TOKEN }}

      - run: nix flake metadata

      - run: |
          cat <<-EOF > modules/ci-runtime.nix
          {
            _module.args.CI = true;
          }
          EOF

      - name: Build harmony
        run: nix build .#nixosConfigurations.harmony.config.system.build.toplevel

      - name: Build melaan
        run: nix build .#nixosConfigurations.melaan.config.system.build.toplevel

      - name: Build tensoon
        run: nix build .#nixosConfigurations.tensoon.config.system.build.toplevel

      - name: Build omarshal@dev203.meraki.com
        run: nix build '.#homeConfigurations."omarshal@dev203.meraki.com".activationPackage'

  build-darwin:
    name: Build Darwin hosts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            accept-flake-config = true

      # Push-only (`skip-use`): pulls already come from the flake's own nixConfig, trusted via
      # accept-flake-config above. No push without a token (e.g. Dependabot PRs, which don't see
      # Actions secrets) - unlike cachix-action, attic-action doesn't fall back to pull-only itself.
      - name: Setup Nix cache
        uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0.5.2
        with:
          cache: oscarmarshall
          endpoint: https://attic.silverlight-nex.us
          inputs-from: .
          skip-push: ${{ secrets.ATTIC_TOKEN == '' }}
          skip-use: true
          token: ${{ secrets.ATTIC_TOKEN }}

      - run: nix flake metadata

      - run: |
          cat <<-EOF > modules/ci-runtime.nix
          {
            _module.args.CI = true;
          }
          EOF

      - name: Build OMARSHAL-M-T2QF
        run: nix build .#darwinConfigurations.OMARSHAL-M-T2QF.config.system.build.toplevel
