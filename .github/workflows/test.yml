name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux hosts
    runs-on: ubuntu-latest
    env:
      # Dependabot and fork PRs don't get Actions secrets, so both come through empty there - and
      # tailscale/github-action hard-fails on an empty auth key. Gate the remote builder on them
      # instead, so those runs just build on the runner as before.
      REMOTE_BUILDER: ${{ secrets.TAILSCALE_CI_AUTHKEY != '' && secrets.REMOTE_BUILDER_CI_SSH_KEY != '' }}
    steps:
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}

      # harmony (modules/aspects/my/remote-builder.nix) offloads these builds off the runner's
      # shared 2-4 vCPUs onto harmony's 32 threads - a bigger win here than for melaan/tensoon
      # (which are already native x86_64-linux too) specifically for the custom/optimized
      # derivations that don't substitute from Cachix. Secrets are a standing credential living in
      # GitHub's own secret store, NOT agenix - see harmony.nix's own comment on why that's a
      # deliberately separate, independently-revocable key from the one melaan/tensoon use.
      # GitHub withholds both secrets from a fork PR's `pull_request`-triggered run (not
      # `pull_request_target`), same protection secrets.CACHIX_AUTH_TOKEN below already relies on -
      # see REMOTE_BUILDER above for how those runs skip the builder.
      - name: Write remote-builder SSH key
        if: env.REMOTE_BUILDER == 'true'
        run: |
          umask 077
          printf '%s' "$REMOTE_BUILDER_SSH_KEY" > "$RUNNER_TEMP/remote-builder-ci-key"
        env:
          REMOTE_BUILDER_SSH_KEY: ${{ secrets.REMOTE_BUILDER_CI_SSH_KEY }}

      - name: Connect to tailnet
        if: env.REMOTE_BUILDER == 'true'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          authkey: ${{ secrets.TAILSCALE_CI_AUTHKEY }}
          args: --login-server=https://headscale.harmony.silverlight-nex.us --accept-dns
          ping: harmony.ts.silverlight-nex.us

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            accept-flake-config = true
            ${{ env.REMOTE_BUILDER == 'true' && format('builders = ssh-ng://oscar@harmony.ts.silverlight-nex.us x86_64-linux {0}/remote-builder-ci-key 24 1 big-parallel,kvm,nixos-test - c3NoLWVkMjU1MTkgQUFBQUMzTnphQzFsWkRJMU5URTVBQUFBSU1rTTV1Tlkwck15MlFNRzZJcHRseGdWbDRzUVdvZVNTTm1VcDcvZjJ6MUIK', runner.temp) || '' }}
            builders-use-substitutes = true

      - name: Setup Nix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: oscarmarshall
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - run: nix flake metadata

      - run: |
          cat <<-EOF > modules/ci-runtime.nix
          {
            _module.args.CI = true;
          }
          EOF

      - name: Flake check
        run: nix flake check

      - name: Build harmony
        run: nix build .#nixosConfigurations.harmony.config.system.build.toplevel

      - name: Build melaan
        run: nix build .#nixosConfigurations.melaan.config.system.build.toplevel

      - name: Build tensoon
        run: nix build .#nixosConfigurations.tensoon.config.system.build.toplevel
