name: Write Flake

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  write-flake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.PAT || github.token }}

      # accept-flake-config: the flake's nixConfig enables Lix's `flake-self-attrs`, without which
      # evaluating (and locking) the Umbriel input fails - see modules/aspects/my/nix.nix.
      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d # v2026-06-15
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Setup Nix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: oscarmarshall
          authToken: "${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}"

      - name: Run write-flake
        run: |
          nix run .#write-flake

          if ! git diff --quiet; then
            nix flake update
            iterations=0
            while true; do
              flake_before=$(cat flake.nix)
              nix run .#write-flake
              [ "$(cat flake.nix)" = "$flake_before" ] && break
              iterations=$((iterations + 1))
              [ "$iterations" -ge 10 ] && echo "write-flake did not converge" >&2 && exit 1
            done
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Write Flake: Auto-update flake.nix"
            git push
          else
            echo "No changes to commit"
          fi
