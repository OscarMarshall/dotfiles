name: Write Flake

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  write-flake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.PAT || github.token }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true

      # Push-only, and only off main - see test.yml's own comment on this step.
      - name: Setup Nix cache
        uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0.5.2
        with:
          cache: oscarmarshall
          endpoint: https://attic.silverlight-nex.us
          inputs-from: .
          skip-push: ${{ github.event_name == 'pull_request' || secrets.ATTIC_TOKEN == '' }}
          skip-use: true
          token: "${{ github.event_name != 'pull_request' && secrets.ATTIC_TOKEN || '' }}"

      - name: Run write-flake
        run: |
          nix run .#write-flake

          if ! git diff --quiet; then
            nix flake update
            iterations=0
            while true; do
              flake_before=$(cat flake.nix)
              nix run .#write-flake
              [ "$(cat flake.nix)" = "$flake_before" ] && break
              iterations=$((iterations + 1))
              [ "$iterations" -ge 10 ] && echo "write-flake did not converge" >&2 && exit 1
            done
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Write Flake: Auto-update flake.nix"
            git push
          else
            echo "No changes to commit"
          fi
